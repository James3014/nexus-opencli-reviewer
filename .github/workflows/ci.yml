name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout current event subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind current checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create isolated verifier environment
        shell: bash
        env:
          VENV_DIR: ${{ runner.temp }}/nexus-reviewer-ci-venv
        run: |
          set -euo pipefail
          python -m venv "$VENV_DIR"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"
          "$VENV_DIR/bin/python" -m pip install --disable-pip-version-check pytest pyyaml
          "$VENV_DIR/bin/python" -m pip install --no-deps --no-index ./vendor/repository_intelligence_engine-0.1.0-py3-none-any.whl

      - name: Verify CI workflow contract
        shell: bash
        run: python -m pytest -q tests/test_ci_workflow.py

      - name: Run service and publication package tests
        shell: bash
        run: python -m pytest -q tests/test_service.py tests/test_service_cli.py tests/test_publication.py

      - name: Run full test suite
        shell: bash
        run: python -m pytest -q
